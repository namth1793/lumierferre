[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* → Railway backend (thay YOUR_RAILWAY_URL sau khi deploy Railway)
[[redirects]]
  from    = "/api/*"
  to      = "https://lumierferre.up.railway.app/api/:splat"
  status  = 200
  force   = true

# SPA fallback — tất cả route trả về index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
